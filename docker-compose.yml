
services:
  mongo:
    image: mongo:7.0
    container_name: fullstack-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPass123
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - fullstack-network

  backend:
    build: ./backend
    container_name: fullstack-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:MongoPass123@mongo:27017/fullstackdb?authSource=admin
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - fullstack-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: fullstack-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - fullstack-network

volumes:
  mongo_data:

networks:
  fullstack-network:
    driver: bridge
